        <path d="M41 20c13 9-11 12 2 22M49 17c14 10-10 14 2 24" fill="none" stroke="#e76f00" stroke-width="3" stroke-linecap="round"/>
        <path d="M29 45h29c0 12-7 17-15 17s-14-5-14-17Zm29 3h4c7 0 7 9-2 10" fill="none" stroke="#2874a6" stroke-width="3" stroke-linecap="round"/>
        <text x="88" y="39" fill="#fff" font-family="Arial,sans-serif" font-size="22" font-weight="700">Java</text>
        <text x="88" y="59" fill="#aeb7c2" font-family="Arial,sans-serif" font-size="12">Backend engineering</text>
      </g>

      <g transform="translate(678 18)">
        <rect width="300" height="80" rx="22" fill="#161b22" stroke="#6db33f" stroke-width="2"/>
        <circle cx="45" cy="40" r="28" fill="#6db33f"/>
        <path d="M25 45c18 4 34-3 41-20-2 25-16 39-37 33 11-3 20-9 27-19-9 8-18 11-31 10Z" fill="#fff"/>
        <text x="88" y="39" fill="#fff" font-family="Arial,sans-serif" font-size="21" font-weight="700">Spring Boot</text>
        <text x="88" y="59" fill="#aeb7c2" font-family="Arial,sans-serif" font-size="12">Production-ready services</text>
      </g>

