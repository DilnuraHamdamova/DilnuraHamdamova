<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="116" viewBox="0 0 1000 116" role="img" aria-label="Animated technology stack: IntelliJ IDEA, Java and Spring Boot">
  <defs>
    <linearGradient id="ij" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2d8d"/>
      <stop offset=".48" stop-color="#7b61ff"/>
      <stop offset="1" stop-color="#18a8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity=".18"/>
    </filter>
    <clipPath id="frame"><rect width="1000" height="116" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <g filter="url(#shadow)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="13s" repeatCount="indefinite"/>

      <!-- First repeating set -->
      <g transform="translate(22 18)">
        <rect width="286" height="80" rx="22" fill="#161b22" stroke="#ff4fa3" stroke-width="2"/>
        <rect x="17" y="13" width="54" height="54" rx="12" fill="url(#ij)"/>
        <rect x="26" y="22" width="36" height="36" rx="4" fill="#080b12"/>
        <text x="31" y="43" fill="#fff" font-family="Arial,sans-serif" font-size="14" font-weight="800">IJ</text>
        <path d="M31 51h25" stroke="#fff" stroke-width="3"/>
        <text x="88" y="37" fill="#fff" font-family="Arial,sans-serif" font-size="20" font-weight="700">IntelliJ IDEA</text>
        <text x="88" y="58" fill="#aeb7c2" font-family="Arial,sans-serif" font-size="12">Development environment</text>
      </g>

      <g transform="translate(350 18)">
        <rect width="286" height="80" rx="22" fill="#161b22" stroke="#4c7dff" stroke-width="2"/>
